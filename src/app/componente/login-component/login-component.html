<section class="login-section">

  <div class="wrapper">
    <div class="title">Wattzy</div>
    <form (ngSubmit)="login()">
      <div class="field">
        <label>Email o nombre de usuario</label>
        <input type="text" matInput placeholder="Usuario" [(ngModel)]="username" name="username" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input
          type="password"
          matInput
          placeholder="Contraseña"
          [(ngModel)]="password"
          name="password"
          required
        >

      </div>
      <div class="field">
        <input type="submit" value="Iniciar sesión">
      </div>
      <div class="signup-link">
        ¿No eres de aquí? <a [routerLink]="['/register']"><u>Registrate</u></a>
      </div>
    </form>
  </div>
</section>
